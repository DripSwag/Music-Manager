# This is a basic workflow to help you get started with Actions

name: Build Desktop Binaries

# Controls when the workflow will run
on:
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build-linux:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Code-Checkout
        uses: actions/checkout@v4

      - name: Build Linux App Image
        run: gradlew :desktopApp:packageAppImage

      - name: Move App Image for Upload
        run: |
          mkdir -p upload
          cp 'desktopApp/build/compose/binaries/main/app/Music Manager/bin/Music Manager' upload/

      - name: Upload Linux
        uses: action/upload-artifact@v7
        with:
          name: Music Manager
          path: upload/*
